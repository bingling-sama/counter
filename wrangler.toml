name = "counter"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "counter-db"
database_id = "YOUR_D1_DATABASE_ID"

# Assets / Public folder for client scripts like counter.js
[site]
bucket = "./public"
